<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MatchMaker Fútbol</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen p-4 md:p-8">

  <div class="max-w-4xl mx-auto space-y-8">
    <header class="text-center">
      <h1 class="text-3xl font-bold text-green-400">⚽ MatchMaker Fútbol</h1>
      <p class="text-gray-400">Armá equipos equilibrados por posición y nivel</p>
    </header>

    <!-- Formulario de Registro / Edición -->
    <section class="bg-gray-800 p-6 rounded-xl shadow-lg border border-gray-700">
      <div class="flex justify-between items-center mb-4">
        <h2 id="formTitle" class="text-xl font-semibold">Registrar Jugador</h2>
        <button id="btnCancelEdit" class="hidden text-xs bg-gray-600 hover:bg-gray-500 text-white px-2 py-1 rounded">Cancelar Edición</button>
      </div>
      
      <form id="playerForm" class="grid grid-cols-1 md:grid-cols-4 gap-4">
        <input type="hidden" id="playerId">
        <input type="text" id="nombre" placeholder="Nombre de jugador" required class="bg-gray-700 px-4 py-2 rounded text-white border border-gray-600 focus:outline-none focus:border-green-500">
        <input type="number" id="media" placeholder="Media (1-99)" min="1" max="99" required class="bg-gray-700 px-4 py-2 rounded text-white border border-gray-600 focus:outline-none focus:border-green-500">
        <select id="posicion" required class="bg-gray-700 px-4 py-2 rounded text-white border border-gray-600 focus:outline-none focus:border-green-500">
          <option value="">Posición principal</option>
          <option value="POR">Arquero (POR)</option>
          <option value="DEF">Defensor (DEF)</option>
          <option value="MED">Mediocampista (MED)</option>
          <option value="DEL">Delantero (DEL)</option>
        </select>
        <button type="submit" id="btnSubmit" class="bg-green-600 hover:bg-green-500 text-white font-bold py-2 px-4 rounded transition">Guardar</button>
      </form>
    </section>

    <!-- Selección de Convocados -->
    <section class="bg-gray-800 p-6 rounded-xl shadow-lg border border-gray-700 space-y-4">
      <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
        <div>
          <h2 class="text-xl font-semibold">Convocados (<span id="selectedCount">0</span>)</h2>
          <p id="formatBadge" class="text-xs text-yellow-400 font-medium">Seleccioná jugadores para detectar formato</p>
        </div>

        <div class="flex flex-wrap items-center gap-2 w-full md:w-auto">
          <input type="text" id="searchInput" placeholder="Buscar jugador..." class="bg-gray-700 text-sm px-3 py-1.5 rounded border border-gray-600 focus:outline-none focus:border-green-500 flex-1 md:w-40">
          <button id="btnUnselectAll" class="text-xs bg-gray-700 hover:bg-gray-600 text-gray-300 px-3 py-2 rounded border border-gray-600">Desmarcar Todos</button>
          <button id="btnArmar" class="bg-blue-600 hover:bg-blue-500 text-white font-bold py-2 px-5 rounded transition disabled:opacity-50">Armar Equipos</button>
        </div>
      </div>

      <div id="playerList" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3">
        <!-- Carga dinámica -->
      </div>
    </section>

    <!-- Resultado de Equipos -->
    <section id="resultsSection" class="hidden space-y-4">
      <div class="flex justify-between items-center bg-gray-800 p-4 rounded-xl border border-gray-700">
        <h3 class="text-lg font-bold text-green-400">Equipos Armados</h3>
        <div class="flex gap-2">
          <button id="btnResortear" class="bg-purple-600 hover:bg-purple-500 text-white text-sm font-semibold px-4 py-2 rounded transition flex items-center gap-1">
            🔀 Re-sortear
          </button>
          <button id="btnWsp" class="bg-green-600 hover:bg-green-500 text-white text-sm font-semibold px-4 py-2 rounded transition flex items-center gap-1">
            📲 WhatsApp
          </button>
        </div>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <div class="bg-gray-800 p-6 rounded-xl border-2 border-blue-500">
          <div class="flex justify-between items-center mb-4 border-b border-gray-700 pb-2">
            <h3 class="text-lg font-bold text-blue-400">Equipo 1</h3>
            <span class="bg-blue-900 text-blue-200 text-sm font-semibold px-2.5 py-0.5 rounded" id="avgEq1">Media: 0</span>
          </div>
          <ul id="listEq1" class="space-y-2"></ul>
        </div>

        <div class="bg-gray-800 p-6 rounded-xl border-2 border-red-500">
          <div class="flex justify-between items-center mb-4 border-b border-gray-700 pb-2">
            <h3 class="text-lg font-bold text-red-400">Equipo 2</h3>
            <span class="bg-red-900 text-red-200 text-sm font-semibold px-2.5 py-0.5 rounded" id="avgEq2">Media: 0</span>
          </div>
          <ul id="listEq2" class="space-y-2"></ul>
        </div>
      </div>
    </section>
  </div>

  <!-- Firebase SDK Modules -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, doc, updateDoc, deleteDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // Reemplaza con tus claves de Firebase
    const firebaseConfig = {
        apiKey: "AIzaSyDLD9jgjvzyXYfv43KUMwkmZVNPIK0epnk",
        authDomain: "futbol-24821.firebaseapp.com",
        projectId: "futbol-24821",
        storageBucket: "futbol-24821.firebasestorage.app",
        messagingSenderId: "911015540483",
        appId: "1:911015540483:web:fffc82fed7cc8820cf5b36",
        measurementId: "G-X5PPFF23D6"
        };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const playersRef = collection(db, "jugadores");

    let allPlayers = [];
    let selectedPlayerIds = new Set();
    let currentEq1 = [], currentEq2 = [];

    // Cargar jugadores
    onSnapshot(playersRef, (snapshot) => {
      allPlayers = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
      renderPlayerList();
    });

    // Guardar / Editar
    document.getElementById("playerForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const id = document.getElementById("playerId").value;
      const nombre = document.getElementById("nombre").value.trim();
      const media = Number(document.getElementById("media").value);
      const posicion = document.getElementById("posicion").value;

      if (!nombre || !media || !posicion) return;

      if (id) {
        await updateDoc(doc(db, "jugadores", id), { nombre, media, posicion });
        resetForm();
      } else {
        await addDoc(playersRef, { nombre, media, posicion });
        resetForm();
      }
    });

    function resetForm() {
      document.getElementById("playerForm").reset();
      document.getElementById("playerId").value = "";
      document.getElementById("formTitle").innerText = "Registrar Jugador";
      document.getElementById("btnSubmit").innerText = "Guardar";
      document.getElementById("btnCancelEdit").classList.add("hidden");
    }

    document.getElementById("btnCancelEdit").onclick = resetForm;

    // Filtro de búsqueda
    document.getElementById("searchInput").oninput = () => renderPlayerList();

    // Desmarcar todos
    document.getElementById("btnUnselectAll").onclick = () => {
      selectedPlayerIds.clear();
      updateSelectedCount();
      renderPlayerList();
    };

    function updateSelectedCount() {
      const count = selectedPlayerIds.size;
      document.getElementById("selectedCount").innerText = count;

      const badge = document.getElementById("formatBadge");
      if (count === 0) badge.innerText = "Selecciona jugadores para detectar formato";
      else if (count % 2 !== 0) badge.innerText = `⚠️ ${count} seleccionados (Número impar)`;
      else if (count === 10) badge.innerText = "⚽ Formato: Fútbol 5 (5 vs 5)";
      else if (count === 14) badge.innerText = "⚽ Formato: Fútbol 7 (7 vs 7)";
      else if (count === 22) badge.innerText = "⚽ Formato: Fútbol 11 (11 vs 11)";
      else badge.innerText = `⚽ ${count / 2} vs ${count / 2}`;
    }

    // Renderizar Lista
    function renderPlayerList() {
      const listContainer = document.getElementById("playerList");
      const searchTerm = document.getElementById("searchInput").value.toLowerCase();
      listContainer.innerHTML = "";

      const filtered = allPlayers
        .filter(p => p.nombre.toLowerCase().includes(searchTerm) || p.posicion.toLowerCase().includes(searchTerm))
        .sort((a, b) => b.media - a.media);

      filtered.forEach(player => {
        const isSelected = selectedPlayerIds.has(player.id);
        const card = document.createElement("div");
        card.className = `p-3 rounded-lg border transition flex justify-between items-center ${
          isSelected ? "bg-green-900/60 border-green-500" : "bg-gray-700 border-gray-600 hover:border-gray-500"
        }`;
        
        card.innerHTML = `
          <div class="flex-1 cursor-pointer select-none pr-2" id="select-${player.id}">
            <div class="flex items-center space-x-2">
              <span class="font-bold text-sm text-white">${player.nombre}</span>
              <span class="text-[10px] bg-gray-800 text-gray-300 font-semibold px-1.5 py-0.5 rounded border border-gray-600">${player.posicion}</span>
            </div>
            <p class="text-xs text-gray-400">Media: <span class="font-mono font-bold text-green-400 text-sm">${player.media}</span></p>
          </div>
          <div class="flex items-center space-x-1">
            <button id="edit-${player.id}" title="Editar" class="p-1 text-gray-400 hover:text-yellow-400 transition">✏️</button>
            <button id="del-${player.id}" title="Eliminar" class="p-1 text-gray-400 hover:text-red-400 transition">🗑️</button>
          </div>
        `;

        listContainer.appendChild(card);

        document.getElementById(`select-${player.id}`).onclick = () => {
          if (selectedPlayerIds.has(player.id)) selectedPlayerIds.delete(player.id);
          else selectedPlayerIds.add(player.id);
          updateSelectedCount();
          renderPlayerList();
        };

        document.getElementById(`edit-${player.id}`).onclick = (e) => {
          e.stopPropagation();
          document.getElementById("playerId").value = player.id;
          document.getElementById("nombre").value = player.nombre;
          document.getElementById("media").value = player.media;
          document.getElementById("posicion").value = player.posicion;
          document.getElementById("formTitle").innerText = `Editar a ${player.nombre}`;
          document.getElementById("btnSubmit").innerText = "Actualizar";
          document.getElementById("btnCancelEdit").classList.remove("hidden");
          window.scrollTo({ top: 0, behavior: 'smooth' });
        };

        document.getElementById(`del-${player.id}`).onclick = async (e) => {
          e.stopPropagation();
          if (confirm(`¿Eliminar a ${player.nombre}?`)) {
            selectedPlayerIds.delete(player.id);
            updateSelectedCount();
            await deleteDoc(doc(db, "jugadores", player.id));
          }
        };
      });
    }

    // ALGORITMO AVANZADO DE BALANCEO
    function balancearEquipos(jugadores, allowRandomness = false) {
      const eq1 = [];
      const eq2 = [];
      let sum1 = 0;
      let sum2 = 0;

      // Agrupar por posiciones
      const arqueros = jugadores.filter(p => p.posicion === 'POR');
      const campo = jugadores.filter(p => p.posicion !== 'POR');

      // 1. Repartir Arqueros primero
      arqueros.forEach((arq) => {
        if (sum1 <= sum2) { eq1.push(arq); sum1 += arq.media; }
        else { eq2.push(arq); sum2 += arq.media; }
      });

      // 2. Ordenar jugadores de campo por posición y media
      let pool = [...campo].sort((a, b) => b.media - a.media);

      if (allowRandomness) {
        // Mezclar ligeramente jugadores con medias similares (+/- 3 puntos)
        for (let i = 0; i < pool.length - 1; i++) {
          if (Math.abs(pool[i].media - pool[i+1].media) <= 3 && Math.random() > 0.5) {
            [pool[i], pool[i+1]] = [pool[i+1], pool[i]];
          }
        }
      }

      // 3. Snake draft con balance de suma de medias
      pool.forEach(player => {
        if (sum1 <= sum2) {
          eq1.push(player);
          sum1 += player.media;
        } else {
          eq2.push(player);
          sum2 += player.media;
        }
      });

      return { eq1, eq2, sum1, sum2 };
    }

    document.getElementById("btnArmar").onclick = () => {
      const selected = allPlayers.filter(p => selectedPlayerIds.has(p.id));
      if (selected.length < 2) {
        alert("Selecciona al menos 2 jugadores.");
        return;
      }
      const res = balancearEquipos(selected, false);
      currentEq1 = res.eq1; currentEq2 = res.eq2;
      renderResults(res.eq1, res.eq2, res.sum1, res.sum2);
    };

    document.getElementById("btnResortear").onclick = () => {
      const selected = allPlayers.filter(p => selectedPlayerIds.has(p.id));
      const res = balancearEquipos(selected, true);
      currentEq1 = res.eq1; currentEq2 = res.eq2;
      renderResults(res.eq1, res.eq2, res.sum1, res.sum2);
    };

    function renderResults(eq1, eq2, sum1, sum2) {
      const avg1 = (sum1 / eq1.length).toFixed(1);
      const avg2 = (sum2 / eq2.length).toFixed(1);

      document.getElementById("avgEq1").innerText = `Promedio: ${avg1}`;
      document.getElementById("avgEq2").innerText = `Promedio: ${avg2}`;

      const list1 = document.getElementById("listEq1");
      const list2 = document.getElementById("listEq2");

      list1.innerHTML = eq1.map(p => `<li class="flex justify-between bg-gray-700 p-2 rounded text-sm"><span><b>${p.nombre}</b> (${p.posicion})</span> <span class="text-green-400 font-mono">${p.media}</span></li>`).join("");
      list2.innerHTML = eq2.map(p => `<li class="flex justify-between bg-gray-700 p-2 rounded text-sm"><span><b>${p.nombre}</b> (${p.posicion})</span> <span class="text-green-400 font-mono">${p.media}</span></li>`).join("");

      document.getElementById("resultsSection").classList.remove("hidden");
      window.scrollTo({ top: document.getElementById("resultsSection").offsetTop - 20, behavior: 'smooth' });
    }

    // Compartir por WhatsApp
    document.getElementById("btnWsp").onclick = () => {
      const avg1 = (currentEq1.reduce((acc, p) => acc + p.media, 0) / currentEq1.length).toFixed(1);
      const avg2 = (currentEq2.reduce((acc, p) => acc + p.media, 0) / currentEq2.length).toFixed(1);

      let text = `⚽ *PARTIDO CONFIRMADO* ⚽\n\n`;
      text += `🔵 *EQUIPO 1* (Promedio: ${avg1})\n`;
      currentEq1.forEach(p => text += `• ${p.nombre} (${p.posicion})\n`);

      text += `\n🔴 *EQUIPO 2* (Promedio: ${avg2})\n`;
      currentEq2.forEach(p => text += `• ${p.nombre} (${p.posicion})\n`);

      const url = `https://api.whatsapp.com/send?text=${encodeURIComponent(text)}`;
      window.open(url, '_blank');
    };
  </script>
</body>
</html>
