<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Armador de Equipos Parejos</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen p-4 md:p-8">

  <div class="max-w-4xl mx-auto space-y-8">
    <header class="text-center">
      <h1 class="text-3xl font-bold text-green-400">⚽ MatchMaker Fútbol</h1>
      <p class="text-gray-400">Registra jugadores y arma equipos equilibrados automáticamente</p>
    </header>

    <!-- Formulario de Registro -->
    <section class="bg-gray-800 p-6 rounded-xl shadow-lg border border-gray-700">
      <h2 class="text-xl font-semibold mb-4">Registrar / Editar Jugador</h2>
      <form id="playerForm" class="grid grid-cols-1 md:grid-cols-4 gap-4">
        <input type="text" id="nombre" placeholder="Nombre de jugador" required class="bg-gray-700 px-4 py-2 rounded text-white border border-gray-600 focus:outline-none focus:border-green-500">
        <input type="number" id="media" placeholder="Media (1-99)" min="1" max="99" required class="bg-gray-700 px-4 py-2 rounded text-white border border-gray-600 focus:outline-none focus:border-green-500">
        <select id="posicion" required class="bg-gray-700 px-4 py-2 rounded text-white border border-gray-600 focus:outline-none focus:border-green-500">
          <option value="">Posición principal</option>
          <option value="POR">Arquero (POR)</option>
          <option value="DEF">Defensor (DEF)</option>
          <option value="MED">Mediocampista (MED)</option>
          <option value="DEL">Delantero (DEL)</option>
        </select>
        <button type="submit" class="bg-green-600 hover:bg-green-500 text-white font-bold py-2 px-4 rounded transition">Guardar</button>
      </form>
    </section>

    <!-- Selección de Jugadores Presentes -->
    <section class="bg-gray-800 p-6 rounded-xl shadow-lg border border-gray-700">
      <div class="flex justify-between items-center mb-4">
        <h2 class="text-xl font-semibold">Jugadores Convocados (<span id="selectedCount">0</span>)</h2>
        <button id="btnArmar" class="bg-blue-600 hover:bg-blue-500 text-white font-bold py-2 px-6 rounded transition disabled:opacity-50">Armar Equipos</button>
      </div>

      <div id="playerList" class="grid grid-cols-2 md:grid-cols-4 gap-3">
        <!-- Se cargan dinámicamente desde Firestore -->
      </div>
    </section>

    <!-- Resultado de Equipos -->
    <section id="resultsSection" class="hidden grid grid-cols-1 md:grid-cols-2 gap-6">
      <div class="bg-gray-800 p-6 rounded-xl border-2 border-blue-500">
        <div class="flex justify-between items-center mb-4 border-b border-gray-700 pb-2">
          <h3 class="text-lg font-bold text-blue-400">Equipo 1</h3>
          <span class="bg-blue-900 text-blue-200 text-sm font-semibold px-2.5 py-0.5 rounded" id="avgEq1">Media: 0</span>
        </div>
        <ul id="listEq1" class="space-y-2"></ul>
      </div>

      <div class="bg-gray-800 p-6 rounded-xl border-2 border-red-500">
        <div class="flex justify-between items-center mb-4 border-b border-gray-700 pb-2">
          <h3 class="text-lg font-bold text-red-400">Equipo 2</h3>
          <span class="bg-red-900 text-red-200 text-sm font-semibold px-2.5 py-0.5 rounded" id="avgEq2">Media: 0</span>
        </div>
        <ul id="listEq2" class="space-y-2"></ul>
      </div>
    </section>
  </div>

  <!-- Firebase SDK Modules -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // Reemplaza con la configuración de tu consola de Firebase
    const firebaseConfig = {
  apiKey: "AIzaSyDLD9jgjvzyXYfv43KUMwkmZVNPIK0epnk",
  authDomain: "futbol-24821.firebaseapp.com",
  projectId: "futbol-24821",
  storageBucket: "futbol-24821.firebasestorage.app",
  messagingSenderId: "911015540483",
  appId: "1:911015540483:web:fffc82fed7cc8820cf5b36",
  measurementId: "G-X5PPFF23D6"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const playersRef = collection(db, "jugadores");

    let allPlayers = [];
    let selectedPlayerIds = new Set();

    // Cargar jugadores en tiempo real
    onSnapshot(playersRef, (snapshot) => {
      allPlayers = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
      renderPlayerList();
    });

    // Guardar o Actualizar Jugador
    document.getElementById("playerForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const nombre = document.getElementById("nombre").value.trim();
      const media = Number(document.getElementById("media").value);
      const posicion = document.getElementById("posicion").value;

      if (!nombre || !media || !posicion) return;

      await addDoc(playersRef, { nombre, media, posicion });
      document.getElementById("playerForm").reset();
    });

    // Renderizar lista de convocables
    function renderPlayerList() {
      const listContainer = document.getElementById("playerList");
      listContainer.innerHTML = "";

      allPlayers.sort((a, b) => b.media - a.media).forEach(player => {
        const isSelected = selectedPlayerIds.has(player.id);
        const card = document.createElement("div");
        card.className = `p-3 rounded-lg border cursor-pointer transition flex justify-between items-center ${
          isSelected ? "bg-green-900 border-green-500" : "bg-gray-700 border-gray-600 hover:border-gray-400"
        }`;
        
        card.innerHTML = `
          <div>
            <p class="font-bold text-sm">${player.nombre}</p>
            <span class="text-xs bg-gray-600 px-1.5 py-0.5 rounded text-gray-300">${player.posicion}</span>
          </div>
          <span class="text-lg font-mono font-bold text-green-400">${player.media}</span>
        `;

        card.onclick = () => {
          if (selectedPlayerIds.has(player.id)) {
            selectedPlayerIds.delete(player.id);
          } else {
            selectedPlayerIds.add(player.id);
          }
          document.getElementById("selectedCount").innerText = selectedPlayerIds.size;
          renderPlayerList();
        };

        listContainer.appendChild(card);
      });
    }

    // Algoritmo de Balanceo (Greedy snake drafting con ajustes de posición)
    document.getElementById("btnArmar").onclick = () => {
      const selected = allPlayers.filter(p => selectedPlayerIds.has(p.id));
      if (selected.length < 2) {
        alert("Selecciona al menos 2 jugadores.");
        return;
      }

      // Ordenar seleccionados de mayor a menor media
      const pool = [...selected].sort((a, b) => b.media - a.media);

      const eq1 = [];
      const eq2 = [];
      let sum1 = 0;
      let sum2 = 0;

      // Asignar alternando sumas para equilibrar el total acumulado
      pool.forEach(player => {
        if (sum1 <= sum2) {
          eq1.push(player);
          sum1 += player.media;
        } else {
          eq2.push(player);
          sum2 += player.media;
        }
      });

      renderResults(eq1, eq2, sum1, sum2);
    };

    function renderResults(eq1, eq2, sum1, sum2) {
      const avg1 = (sum1 / eq1.length).toFixed(1);
      const avg2 = (sum2 / eq2.length).toFixed(1);

      document.getElementById("avgEq1").innerText = `Promedio: ${avg1}`;
      document.getElementById("avgEq2").innerText = `Promedio: ${avg2}`;

      const list1 = document.getElementById("listEq1");
      const list2 = document.getElementById("listEq2");

      list1.innerHTML = eq1.map(p => `<li class="flex justify-between bg-gray-700 p-2 rounded text-sm"><span><b>${p.nombre}</b> (${p.posicion})</span> <span class="text-green-400 font-mono">${p.media}</span></li>`).join("");
      list2.innerHTML = eq2.map(p => `<li class="flex justify-between bg-gray-700 p-2 rounded text-sm"><span><b>${p.nombre}</b> (${p.posicion})</span> <span class="text-green-400 font-mono">${p.media}</span></li>`).join("");

      document.getElementById("resultsSection").classList.remove("hidden");
    }
  </script>
</body>
</html>
